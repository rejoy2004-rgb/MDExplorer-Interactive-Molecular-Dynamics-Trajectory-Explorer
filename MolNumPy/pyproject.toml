[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molnumpy"
version = "0.1.0"
description = "Convert molecular dynamics files of any format into one common NumPy-based representation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "MolNumPy Developers"}
]
dependencies = [
    "numpy>=1.20.0",
    "MDAnalysis>=2.0.0",
    "streamlit>=1.20.0",
    "py3Dmol>=2.0.0",
    "stmol>=0.0.9",
    "matplotlib>=3.5.0",
    "plotly>=5.0.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
